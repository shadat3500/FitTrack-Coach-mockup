<title>FitTrack Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: fixed warm sidebar of 9 sections, a working canvas of tables, drawers and one coach. */
:root{
  --bg:#FAF7F5;--panel:#FFFFFF;--sunk:#F4EEEA;--fg:#251C1B;--muted:#76675F;--faint:#A89A93;--line:#ECE2DC;
  --side:#2B2120;--side-fg:#F5ECE8;--side-muted:#B09F98;--side-hi:#3D302E;
  --accent:#DE7272;--accent-ink:#B4434B;--on-accent:#FFFFFF;
  --peach:#FFCA88;--butter:#FFF6A9;--mint:#B4E4D6;
  --chip-free:#EFE8E4;--chip-trial:#FFF3A0;--chip-pro:#FFDDB0;--chip-vip:#F6C9C9;--chip-ink:#3A2A27;
  --c1:#C94F57;--c2:#3B6FD0;--grid:#EFE7E2;
  --good:#23855A;--good-bg:#DDF2E8;--warn:#9A6408;--warn-bg:#FFF0D0;--crit:#C0392B;--crit-bg:#FBE1DD;
  --shadow:0 1px 2px rgba(60,30,25,.06),0 8px 24px rgba(60,30,25,.06);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fd:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151110;--panel:#1E1817;--sunk:#262019;--fg:#F4ECE8;--muted:#AE9E96;--faint:#7D6F69;--line:#352C29;
  --side:#0F0C0B;--side-fg:#F4ECE8;--side-muted:#9C8B84;--side-hi:#2A2120;
  --accent:#E57C7C;--accent-ink:#F29A9C;--on-accent:#1A0F0E;
  --chip-free:#2E2725;--chip-trial:#4A4320;--chip-pro:#4E3A20;--chip-vip:#542C2D;--chip-ink:#F4ECE8;
  --c1:#E06A71;--c2:#5F88E0;--grid:#2B2421;
  --good:#5CC79A;--good-bg:#173528;--warn:#E9B25A;--warn-bg:#3A2C12;--crit:#F08578;--crit-bg:#3D1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151110;--panel:#1E1817;--sunk:#262019;--fg:#F4ECE8;--muted:#AE9E96;--faint:#7D6F69;--line:#352C29;
  --side:#0F0C0B;--side-fg:#F4ECE8;--side-muted:#9C8B84;--side-hi:#2A2120;
  --accent:#E57C7C;--accent-ink:#F29A9C;--on-accent:#1A0F0E;
  --chip-free:#2E2725;--chip-trial:#4A4320;--chip-pro:#4E3A20;--chip-vip:#542C2D;--chip-ink:#F4ECE8;
  --c1:#E06A71;--c2:#5F88E0;--grid:#2B2421;
  --good:#5CC79A;--good-bg:#173528;--warn:#E9B25A;--warn-bg:#3A2C12;--crit:#F08578;--crit-bg:#3D1C18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-fg);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--peach));display:grid;place-items:center;color:#2B1514}
.brand b{font-family:var(--fd);font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--side-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{color:var(--side-muted);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border:0;background:none;border-radius:8px;color:var(--side-fg);text-align:left;font-size:13.5px}
.nav button svg{width:18px;height:18px;opacity:.75;flex:none}
.nav button:hover{background:var(--side-hi)}
.nav button.on{background:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.nav button.on svg{opacity:1;color:var(--accent)}
.nav .badge{margin-left:auto;background:var(--accent);color:#2B1514;font-size:11px;font-weight:600;border-radius:10px;padding:0 7px;line-height:18px}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--side-hi)}
.me .av{background:var(--peach);color:#3A2A27}
.me small{display:block;color:var(--side-muted);font-size:11.5px}
/* main */
main{min-width:0;padding-block:20px 60px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-family:var(--fd);font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card h3{margin:0 0 2px;font-size:15px;font-family:var(--fd);letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.kpi .lab{color:var(--muted);font-size:12.5px}
.kpi .val{font-family:var(--fd);font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .delta{font-size:12.5px;margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--good)}.down{color:var(--crit)}
.spark{display:block;width:100%;height:34px;margin-top:10px}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(.96)}
.btn.dng{color:var(--crit);border-color:var(--crit-bg)}
.btn.dng:hover{background:var(--crit-bg)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:none}
/* inputs */
.in{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 10px;min-width:0}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--faint)}
.search .in{padding-left:32px;width:260px;max-width:100%}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
label.f .in{color:var(--fg);font-size:14px}
textarea.in{resize:vertical;min-height:80px}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;background:var(--sunk);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:500}
.tog{position:relative;width:38px;height:22px;border-radius:11px;background:var(--line);border:0;flex:none;transition:background .15s}
.tog::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--good)}
.tog.on::after{transform:translateX(16px)}
.tog:disabled{opacity:.45;cursor:not-allowed}
/* tables */
.tw{overflow-x:auto;margin:0 -18px -18px;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:9px 12px;background:var(--sunk);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
th:first-child,td:first-child{padding-left:18px}
th:last-child,td:last-child{padding-right:18px}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--fm);font-size:12.5px}
.mut{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--chip-free);color:var(--chip-ink);white-space:nowrap}
.chip.free{background:var(--chip-free)}.chip.trial{background:var(--chip-trial)}.chip.pro{background:var(--chip-pro)}.chip.vip{background:var(--chip-vip)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;border-radius:6px;padding:2px 8px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.good{color:var(--good);background:var(--good-bg)}.st.warn{color:var(--warn);background:var(--warn-bg)}.st.crit{color:var(--crit);background:var(--crit-bg)}.st.neu{color:var(--muted);background:var(--sunk)}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:none;background:var(--chip-pro);color:var(--chip-ink)}
.av.lg{width:72px;height:72px;font-size:24px;background:linear-gradient(135deg,var(--accent),var(--peach));color:#2B1514}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{font-weight:500;display:block}
.who small{color:var(--muted);font-size:12px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--sunk);border-radius:10px;padding:11px 13px;color:var(--muted);font-size:13px}
.note svg{width:18px;height:18px;flex:none;color:var(--accent-ink);margin-top:1px}
.note b{color:var(--fg);font-weight:600}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0;padding-top:0}
.list .it .grow{flex:1;min-width:0}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;font-size:13.5px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;min-width:0;overflow-wrap:anywhere}
/* chart */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:12.5px;line-height:1.4;z-index:60;white-space:nowrap;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.funnel .fr{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.funnel .bar{height:14px;border-radius:0 4px 4px 0;background:var(--c1)}
.funnel .trk{background:var(--sunk);border-radius:0 4px 4px 0}
/* overlay */
#ovl{position:fixed;inset:0;z-index:40;display:none}
#ovl.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(20,10,8,.42)}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slide .2s ease}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100% - 40px);overflow:auto;background:var(--panel);border-radius:16px;box-shadow:var(--shadow);animation:pop .16s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
@keyframes pop{from{transform:translate(-50%,-47%);opacity:.4}}
@media (prefers-reduced-motion:reduce){.drawer,.modal{animation:none}}
.oh{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.oh h2{margin:0;font-size:17px;font-family:var(--fd);flex:1;min-width:0}
.ob{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.of{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:var(--sunk);width:30px;height:30px;border-radius:50%;display:grid;place-items:center}
.x svg{width:16px;height:16px}
.sec-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;z-index:70;display:none;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
#toast.on{display:block}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--fg);border-color:var(--accent);font-weight:500}
.coachhero{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.coachhero .grow{flex:1;min-width:220px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{background:var(--sunk);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.slot{border:1.5px dashed var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;color:var(--muted);min-height:150px}
.slot svg{width:26px;height:26px;color:var(--faint)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.phone{width:240px;max-width:100%;border-radius:30px;background:linear-gradient(160deg,#3b2f2d,#1a1312);padding:12px;margin:0 auto}
.phone .scr{border-radius:20px;background:linear-gradient(180deg,#e9a07a,#c76b6f 60%,#7c4a5a);height:300px;padding:44px 10px 10px;position:relative}
.phone .clock{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;font-family:var(--fd);font-size:34px;font-weight:300}
.push{background:rgba(255,255,255,.82);color:#1b1312;border-radius:13px;padding:9px 11px;font-size:12px;margin-top:40px;backdrop-filter:blur(8px)}
.push .ph{display:flex;align-items:center;gap:6px;font-size:11px;color:#5e504c;margin-bottom:3px}
.push .ph i{width:16px;height:16px;border-radius:4px;background:linear-gradient(135deg,#DE7272,#FFCA88);display:inline-block}
.push b{display:block;font-size:12.5px}
.confirm{background:var(--crit-bg);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;color:var(--crit);font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pill-sample{font-size:11.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:3px 8px;font-weight:500}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:8px 10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));z-index:20;gap:8px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--side)}
  .brand small,.brand b,.me,.nav .grp{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;scrollbar-width:none}
  .nav button{white-space:nowrap;padding:7px 10px}
  .nav button.on{box-shadow:inset 0 -2px 0 var(--accent)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .g2:not(.keep2),.g4{grid-template-columns:minmax(0,1fr)}
  td{white-space:nowrap}
  #chatgrid,#proggrid{grid-template-columns:minmax(0,1fr)!important}
  #chatgrid>div:first-child{max-height:220px!important;border-right:0!important;border-bottom:1px solid var(--line)}
  .search .in{width:100%}
  .top h1{font-size:22px}
}
</style>

/* ---------- charts ---------- */
const MRR=[11.2,12.1,12.9,13.4,14.8,15.6,16.3,17.9,18.4,19.6,20.7,21.64];
const MONTHS=['Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov'];
const STORE=[[8.1,5.2],[8.6,5.6],[9.4,6.0],[9.9,6.6],[10.8,7.0],[11.9,7.4]];
function lineChart(){const W=640,H=230,L=44,R=14,T=14,B=28,max=25;
  const x=i=>L+i*(W-L-R)/(MRR.length-1),y=v=>T+(1-v/max)*(H-T-B);
  let g='';for(let v=0;v<=25;v+=5)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">$${v}k</text>`;
  MONTHS.forEach((m,i)=>{if(i%2===1||i===MONTHS.length-1)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${m}</text>`});
  const pts=MRR.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const area=`M${x(0)},${y(0)} L${pts.replace(/ /g,' L')} L${x(MRR.length-1)},${y(0)}Z`;
  const hits=MRR.map((v,i)=>`<rect x="${x(i)-(W-L-R)/22}" y="${T}" width="${(W-L-R)/11}" height="${H-T-B}" fill="transparent" data-tip="${MONTHS[i]} ${i===11?'2026':''}|MRR <b>$${(v*1000).toLocaleString('en-US')}</b>" data-cx="${x(i)}" data-cy="${y(v)}"/>`).join('');
  const lx=x(11),ly=y(MRR[11]);
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly recurring revenue, Dec 2025 to Nov 2026, rising from $11.2k to $21.6k">
  <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--c1)" stop-opacity=".22"/><stop offset="1" stop-color="var(--c1)" stop-opacity="0"/></linearGradient></defs>
  ${g}<path d="${area}" fill="url(#ga)"/><polyline points="${pts}" fill="none" stroke="var(--c1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--faint)" stroke-dasharray="3 3" visibility="hidden"/>
  <circle id="xd" r="5" fill="var(--c1)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>
  <circle cx="${lx}" cy="${ly}" r="5" fill="var(--c1)" stroke="var(--panel)" stroke-width="2"/>
  <text x="${lx-8}" y="${ly-10}" text-anchor="end" style="fill:var(--fg);font-weight:600">$21.6k</text>${hits}</svg>`;}
function barChart(){const W=420,H=230,L=40,R=8,T=14,B=28,max=20,n=STORE.length,gw=(W-L-R)/n,bw=Math.min(22,(gw-14)/2);
  const y=v=>T+(1-v/max)*(H-T-B);let g='';
  for(let v=0;v<=20;v+=5)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">$${v}k</text>`;
  STORE.forEach((p,i)=>{const cx=L+gw*i+gw/2;
    [0,1].forEach(k=>{const bx=cx-bw-1+k*(bw+2),by=y(p[k]),h=y(0)-by;
      g+=`<path d="M${bx},${y(0)} V${by+4} q0,-4 4,-4 h${bw-8} q4,0 4,4 V${y(0)}Z" fill="var(--c${k+1})" data-tip="${MONTHS[6+i]}|${k?'Google Play':'App Store'} <b>$${(p[k]*1000).toLocaleString('en-US')}</b>"/>`});
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${MONTHS[6+i]}</text>`});
  return`<div class="legend"><span><i style="background:var(--c1)"></i>App Store</span><span><i style="background:var(--c2)"></i>Google Play</span></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Net revenue by store for the last six months. App Store leads every month.">${g}</svg>`;}
function spark(arr){const W=120,H=34,mx=Math.max(...arr),mn=Math.min(...arr);const p=arr.map((v,i)=>`${i*W/(arr.length-1)},${H-3-(v-mn)/(mx-mn||1)*(H-8)}`);
  const last=p[p.length-1].split(',');
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${p.join(' ')}" fill="none" stroke="var(--c1)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}

function coachEdit(){const c=S.coach;open(head('Edit coach profile')+`<form id="cf"><div class="ob">
  <label class="f">Name<input class="in" id="c_name" value="${esc(c.name)}" required></label>
  <label class="f">Short bio<textarea class="in" id="c_bio">${esc(c.bio)}</textarea></label>
  <label class="f">Specialties, comma separated<input class="in" id="c_tags" value="${esc(c.tags.join(', '))}"></label>
  <div class="grid g2" style="gap:12px"><label class="f">City<input class="in" id="c_city" value="${esc(c.city)}"></label><label class="f">Area<input class="in" id="c_area" value="${esc(c.area)}"></label></div>
  <label class="f">Service radius: <span id="rv">${c.radius} km</span><input type="range" id="c_rad" min="5" max="50" step="5" value="${c.radius}"></label>
  <label class="f">Working hours<input class="in" id="c_hours" value="${esc(c.hours)}"></label>
  <label class="f">Away message<textarea class="in" id="c_away">${esc(c.away)}</textarea></label>
  </div><div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Save profile</button></div></form>`);}
function coachReplace(){const n=vip().length;open(head('Replace coach')+`<form id="rf"><div class="ob">
  <div class="note">${ic('alert')}<span>You can only have one coach for now, so the new coach takes over from <b>${esc(S.coach.name)}</b>. ${esc(S.coach.name.split(' ')[0])} loses access to the coach app right away.</span></div>
  <label class="f">New coach name<input class="in" id="r_name" required placeholder="Full name"></label>
  <label class="f">Email for the coach app invite<input class="in" id="r_email" type="email" required placeholder="name@example.com"></label>
  <label class="f">City<input class="in" id="r_city" value="${esc(S.coach.city)}"></label>
  <label class="row" style="gap:8px;font-size:13.5px"><input type="checkbox" id="r_move" checked> Move all ${n} VIP chat threads to the new coach</label>
  <label class="row" style="gap:8px;font-size:13.5px"><input type="checkbox" id="r_tell" checked> Tell VIP members in the app that their coach changed</label>
  </div><div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn dng" type="submit">Replace coach</button></div></form>`,'modal');}
function addContent(){const t=S.contentTab;const L={exercises:['Exercise name','Main muscle','Equipment','Level'],programs:['Program name','Schedule','Where','Level'],meals:['Meal name','Nutrition','Meal time','Diet']}[t];
  open(head('Add '+t.slice(0,-1))+`<form id="af"><div class="ob">${L.map((l,i)=>`<label class="f">${l}<input class="in" id="a${i}" ${i===0?'required':''}></label>`).join('')}
  ${t==='exercises'?'<label class="f">Photo<input class="in" type="file" accept="image/*" id="a4"></label>':''}
  <label class="row" style="gap:8px;font-size:13.5px"><input type="checkbox" id="apub"> Publish now</label></div>
  <div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Add</button></div></form>`,'modal');}
function invite(){open(head('Invite teammate')+`<form id="tf"><div class="ob"><label class="f">Name<input class="in" id="t_n" required></label><label class="f">Email<input class="in" id="t_e" type="email" required></label><label class="f">Role<select class="in" id="t_r"><option>Admin</option><option>Support</option><option selected>Content editor</option></select></label><div class="note">${ic('info')}<span>To add a coach, use the Coach page. There can be one coach for now.</span></div></div><div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Send invite</button></div></form>`,'modal');}
function cellEdit(i,k){const r=S.limits[i];open(head(`${r[0]} · ${['','Free','Pro','VIP'][k]}`)+`<form id="ef" data-i="${i}" data-k="${k}"><div class="ob"><label class="f">Value shown in the app<input class="in" id="e_v" value="${esc(r[k])}"></label></div><div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Save</button></div></form>`,'modal');}

/* ---------- render + events ---------- */
function render(){nav();$('#main').innerHTML=R[S.sec]();document.title='FitTrack Admin';}
function go(k){if(!R[k])k='today';S.sec=k;if(location.hash!=='#'+k)history.replaceState(null,'','#'+k);render();window.scrollTo(0,0)}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,v=el.dataset.v;
  const A={
   go:()=>go(v),close,
   tier:()=>{S.tier=v;render()},store:()=>{S.store=v;render()},
   user:()=>userDrawer(v),
   grant:()=>{const u=USERS.find(x=>x.id===v),t=$('#gt').value,d=$('#gd').value;u.tier=t;u.plan='Granted by team';u.until=+d===30?'Dec 5':`Nov ${5+ +d}`;if(t==='vip'&&!u.km)u.km=12;log(`Granted ${t==='vip'?'VIP':'Pro'} for ${d} days to ${uname(u)}`);toast(`${uname(u)} has ${t==='vip'?'VIP':'Pro'} for ${d} days`);render();userDrawer(v)},
   extend:()=>{const u=USERS.find(x=>x.id===v);u.trialLeft+=7;log(`Extended welcome week by 7 days for ${uname(u)}`);toast('Welcome week extended by 7 days');render();userDrawer(v)},
   resetPlan:()=>{const u=USERS.find(x=>x.id===v);log(`Rebuilt workout plan for ${uname(u)}`);toast('Plan rebuilt. They will see it next time they open the app')},
   delAsk:()=>userDrawer(v,true),
   delDo:()=>{if(($('#delc').value||'').trim().toUpperCase()!=='DELETE'){toast('Type DELETE to confirm');return}const i=USERS.findIndex(x=>x.id===v);const n=uname(USERS[i]);USERS.splice(i,1);log(`Deleted data for ${n}`);close();toast(`Data deleted for ${n}`);render()},
   note:()=>{const u=USERS.find(x=>x.id===v),t=$('#unote').value.trim();if(!t)return;u.notes.push(`${t} · Shadat, just now`);log(`Added a note on ${uname(u)}`);userDrawer(v)},
   savePrices:()=>{S.prices.forEach((p,i)=>{const a=parseFloat($('#pp'+i).value);if(!isNaN(a))p.pro=a;const b=$('#pv'+i);if(b){const c=parseFloat(b.value);if(!isNaN(c))p.vip=c}});log('Updated plan prices');toast('Prices saved. Match them in App Store Connect and Play Console')},
   priceOn:()=>{const p=S.prices[v];p.on=!p.on;log(`${p.on?'Put':'Took'} ${p.k} ${p.on?'on':'off'} sale`);render()},
   welcome:()=>{S.welcome=+v;log(`Changed welcome week to ${v} days`);toast(`Welcome week is now ${v} days for new installs`);render()},
   cell:()=>{const[i,k]=v.split(',').map(Number);const r=S.limits[i];r[k]=r[k]==='✓'?'—':'✓';log(`Changed “${r[0]}” for ${['','Free','Pro','VIP'][k]}`);render()},
   cellEdit:()=>{const[i,k]=v.split(',').map(Number);cellEdit(i,k)},
   coachEdit,coachReplace,
   coachAway:()=>{S.coach.status=S.coach.status==='active'?'away':'active';const away=S.coach.status==='away';log(`Set coach ${S.coach.name} ${away?'away':'active'}`);toast(away?'Coach set away. VIP members now see “Your coach is away”':'Coach is active again');render()},
   rep:()=>{const[id,out]=v.split(',');const r=S.reports.find(x=>x.id==id);r.state='resolved';r.outcome=out;log(`${out} on report #${id} (${r.reason})`);toast(out);render()},
   rule:()=>{S.chatRules[v]=!S.chatRules[v];log(`Changed chat rule: ${v}`);render()},
   ctab:()=>{S.contentTab=v;render()},
   pub:()=>{const c=S.content[S.contentTab][v];if(!c.pub&&S.contentTab==='exercises'&&!c.photo){toast('Add a photo before publishing this exercise');return}c.pub=!c.pub;log(`${c.pub?'Published':'Unpublished'} “${c.n}”`);render()},
   addContent:()=>S.contentTab==='meals'?recipeAdd():addContent(),invite,
   mpNew:()=>{MPLANS.push({name:'New plan',goal:'Stay fit',diet:'Any',target:2200,scale:true,status:'Draft',members:0,days:WEEK.map(()=>[null,null,null,null])});S.mp=MPLANS.length-1;log('Created meal plan “New plan”');render()},
   mpOpen:()=>{S.mp=+v;render();window.scrollTo(0,0)},mpBack:()=>{S.mp=null;render()},
   goMeals:()=>{S.contentTab='meals';go('content')},
   mpScale:()=>{const m=MPLANS[S.mp];m.scale=!m.scale;render()},
   mpCell:()=>{const[j,i]=v.split(',').map(Number);S.mpQ='';mpPicker(j,i)},
   mpPick:()=>{const[j,i,id]=v.split(',');const m=MPLANS[S.mp];m.days[+j][+i]=id||null;close();render();toast(id?`${WEEK[+j]} ${SLOTS[+i].toLowerCase()}: ${RECIPES[id].n}`:'Meal removed')},
   mpCopy:()=>{const m=MPLANS[S.mp];m.days=m.days.map(()=>m.days[0].slice());log(`Copied Monday to all days in “${m.name}”`);toast('Monday copied to every day');render()},
   mpFill:()=>{const m=MPLANS[S.mp];let n=0;m.days.forEach((d,j)=>d.forEach((id,i)=>{if(!id){const c=Object.entries(RECIPES).filter(([k,r])=>r.slot===i&&fitsDiet(r,m.diet));if(c.length){d[i]=c[(j+i)%c.length][0];n++}}}));toast(n?`Filled ${n} empty meals with matching recipes`:'No empty meals');render()},
   mpDraft:()=>{const m=MPLANS[S.mp];mpRead(m);log(`Saved draft of meal plan “${m.name}”`);toast('Draft saved. People still see the published version');render()},
   mpPublish:()=>{const m=MPLANS[S.mp];mpRead(m);const empty=m.days.flat().filter(x=>!x).length;if(empty){toast(`Fill the ${empty} empty meals before publishing`);return}const bad=m.days.flat().filter(id=>!fitsDiet(RECIPES[id],m.diet)).length;if(bad){toast(`${bad} meals don’t fit the ${m.diet.toLowerCase()} diet`);return}const was=m.status;m.status='Live';log(`Published meal plan “${m.name}”`);toast(was==='Live'?`Changes are live for ${fmt(m.members)} people from tomorrow`:`“${m.name}” is live for new ${m.goal.toLowerCase()} users`);render()},
   sendNow:()=>{const aud=$('#na').value,t=$('#nt').value;S.notifs.unshift({t,aud,when:$('#nw').value==='Now'?'Just now':$('#nw').value,sent:$('#nw').value==='Now'?fmt(AUD[aud]):'Scheduled',open:'—'});log(`Sent push “${t}” to ${aud}`);toast($('#nw').value==='Now'?`Sent to ${fmt(AUD[aud])} people`:'Scheduled');render()},
   cancelSend:()=>{$('#nconf').innerHTML=''}};
  A[a]&&A[a]();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ovl').classList.contains('on'))close();if(e.key==='Enter'&&e.target.matches('tr.click'))e.target.click()});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
  if(id==='nt')$('#pt').textContent=e.target.value||'Title';if(id==='nb')$('#pb').textContent=e.target.value;
  if(id==='mpq'){S.mpQ=e.target.value;const j=+e.target.dataset.j,i=+e.target.dataset.i,pos=e.target.selectionStart;mpPicker(j,i);const q=$('#mpq');q.focus();q.setSelectionRange(pos,pos)}
  if(id==='c_rad')$('#rv').textContent=e.target.value+' km';});
document.addEventListener('change',e=>{if(['mp_name','mp_goal','mp_diet','mp_target'].includes(e.target.id)&&S.mp!==null){mpRead(MPLANS[S.mp]);render();return}if(e.target.id==='evType'){S.evType=e.target.value;render()}
  if(e.target.dataset.role){const t=S.team[e.target.dataset.role];t.r=e.target.value;log(`Changed ${t.n}’s role to ${t.r}`);toast(`${t.n} is now ${t.r}`)}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
  if(f.id==='nf'){const aud=$('#na').value;$('#nconf').innerHTML=`<div class="confirm" style="background:var(--warn-bg)"><p style="color:var(--warn)">This goes to ${fmt(AUD[aud])} people (${esc(aud)}). Sent messages can’t be pulled back.</p><div class="row"><button type="button" class="btn pri" data-a="sendNow">Send</button><button type="button" class="btn" data-a="cancelSend">Cancel</button></div></div>`}
  if(f.id==='cf'){const c=S.coach;c.name=$('#c_name').value.trim()||c.name;c.bio=$('#c_bio').value;c.tags=$('#c_tags').value.split(',').map(s=>s.trim()).filter(Boolean);c.city=$('#c_city').value;c.area=$('#c_area').value;c.radius=+$('#c_rad').value;c.hours=$('#c_hours').value;c.away=$('#c_away').value;S.team.find(t=>t.r==='Coach').n=c.name;log(`Edited coach profile for ${c.name}`);close();toast('Coach profile saved');render()}
  if(f.id==='rf'){const old=S.coach.name,n=$('#r_name').value.trim(),em=$('#r_email').value.trim();Object.assign(S.coach,{name:n,email:em,city:$('#r_city').value||S.coach.city,since:'Nov 5, 2026',rating:'New',reply:'—',status:'active',bio:'New coach. Profile not filled in yet.',tags:['Strength']});const t=S.team.find(t=>t.r==='Coach');t.n=n;t.e=em;t.last='Invited';log(`Replaced coach ${old} with ${n}${$('#r_move').checked?`, moved ${vip().length} threads`:''}`);close();toast(`${n} is now the coach. Invite sent to ${em}`);render()}
  if(f.id==='af'){const t=S.contentTab;S.content[t].unshift({n:$('#a0').value,a:$('#a1').value||'—',e:$('#a2').value||'—',l:$('#a3').value||'—',pub:$('#apub').checked&&(t!=='exercises'||$('#a4').files.length>0),photo:t==='exercises'?$('#a4').files.length>0:true});log(`Added ${t.slice(0,-1)} “${$('#a0').value}”`);close();toast('Added');render()}
  if(f.id==='rcf'){const id='r'+Date.now();const ing=$('#rc_i').value.split('\n').map(l=>l.split(',').map(x=>x.trim())).filter(a=>a[0]).map(a=>[a[0],+a[1]||0,a[2]||'Pantry']);
    RECIPES[id]={n:$('#rc_n').value.trim(),slot:+$('#rc_s').value,k:+$('#rc_k').value,p:+$('#rc_p').value,c:+$('#rc_c').value,f:+$('#rc_f').value,min:+$('#rc_m').value||20,diet:$('#rc_d').value?[$('#rc_d').value]:[],ing,steps:$('#rc_st').value.split('\n').filter(Boolean)};
    const r=RECIPES[id];S.content.meals.unshift({id,n:r.n,a:`${r.k} kcal · P ${r.p} · C ${r.c} · F ${r.f} g`,e:SLOTS[r.slot],l:r.diet.join(', ')||'Any',pub:true});log(`Added recipe “${r.n}”`);close();toast('Recipe added. You can use it in any meal plan now');render()}
  if(f.id==='tf'){S.team.splice(S.team.length-1,0,{n:$('#t_n').value,e:$('#t_e').value,r:$('#t_r').value,last:'Invited'});log(`Invited ${$('#t_n').value} as ${$('#t_r').value}`);close();toast('Invite sent');render()}
  if(f.id==='ef'){const i=+f.dataset.i,k=+f.dataset.k;S.limits[i][k]=$('#e_v').value||'—';log(`Changed “${S.limits[i][0]}” for ${['','Free','Pro','VIP'][k]}`);close();render()}});

/* tooltip + crosshair */
const tip=$('#tip');
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const xh=$('#xh'),xd=$('#xd');
  if(!t){tip.hidden=true;if(xh){xh.setAttribute('visibility','hidden');xd.setAttribute('visibility','hidden')}return}
  const[a,b]=t.dataset.tip.split('|');tip.innerHTML=`<div style="opacity:.7">${a}</div><div>${b}</div>`;tip.hidden=false;
  const w=tip.offsetWidth;let x=e.clientX+14;if(x+w>innerWidth-8)x=e.clientX-w-14;tip.style.left=x+'px';tip.style.top=(e.clientY-44)+'px';
  if(t.dataset.cx&&xh){xh.setAttribute('x1',t.dataset.cx);xh.setAttribute('x2',t.dataset.cx);xh.setAttribute('visibility','visible');xd.setAttribute('cx',t.dataset.cx);xd.setAttribute('cy',t.dataset.cy);xd.setAttribute('visibility','visible')}});
addEventListener('hashchange',()=>go(location.hash.slice(1)));

   <div class="card" style="margin-top:16px"><h3>Weekly update · Sun, Nov 1</h3><div class="row" style="gap:10px;margin:10px 0">${['Front','Side','Back'].map(v=>`<div style="width:96px;aspect-ratio:3/4;border-radius:10px;background:var(--sunk);display:grid;place-items:center;color:var(--muted);font-size:12px">${ic('lock').replace('<svg class=""','<svg style="width:16px;height:16px"')} ${v}</div>`).join('')}</div><p class="mut" style="margin:0 0 10px;font-size:13px">Progress photos are private. Only Maya can open them.</p><div class="note" style="color:var(--fg)">“Good week, hunger was high on Thursday. Can we add a snack?”</div><div class="row" style="margin-top:10px;flex-wrap:nowrap"><input class="in" id="t_wkr" style="flex:1" placeholder="Reply to the weekly update"><button class="btn pri" data-t="wkreply" data-v="${c.id}">Send review</button></div></div>`;
  if(t==='program'){body=`<div class="card"><h3>Workout program</h3><p class="sub">${c.prog?`Currently on ${esc(c.prog)}`:'No program yet'}. Pick a program, adjust it for ${esc(fname(c))}, then send.</p><div class="list">${PROGS.map((p,i)=>`<div class="it"><div class="grow"><b style="font-weight:500">${esc(p.name)}</b><div class="mut" style="font-size:12.5px">${p.days.length} days a week · ${p.weeks} weeks · ${p.level}</div></div><button class="btn sm" data-t="editprog" data-v="${i}">Edit</button><button class="btn sm pri" data-t="sendprog" data-v="${i},${c.id}">Send to ${esc(fname(c))}</button></div>`).join('')}</div>${c.inj!=='None'?`<div class="note" style="margin-top:12px">${ic('alert')}<span><b>Injury note:</b> ${esc(c.inj)}</span></div>`:''}</div>`;}
  if(t==='diet')body=`<div class="card"><h3>Diet</h3><p class="sub">Uses the meal plans from the Meal plans page. Portions are resized to the calorie target you set.</p><div class="grid g3" style="gap:12px"><label class="f">Meal plan<select class="in" id="t_dplan">${MPLANS.map(m=>`<option ${m.name===c.diet?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label class="f">Calorie target (kcal a day)<input class="in num" id="t_dkcal" value="${c.kcal}" inputmode="numeric"></label><label class="f">Protein (g a day)<input class="in num" id="t_dpro" value="${Math.round(c.w*2)}" inputmode="numeric"></label></div><label class="f" style="margin-top:12px">Note to ${esc(fname(c))}<input class="in" id="t_dnote" placeholder="e.g. Have the snack before evening training"></label><div class="row" style="margin-top:14px"><button class="btn pri" data-t="senddiet" data-v="${c.id}">${ic('meal')}Send diet plan</button><button class="btn" data-t="gomeal">Open meal plan builder</button></div></div>`;
  if(t==='sessions'){const ss=SESS.filter(s=>s.c===c.id);body=`<div class="card"><div class="row" style="justify-content:space-between"><div><h3>Sessions</h3><p class="sub" style="margin:0">${c.left==null?'Online package, video check-ins only':c.left+' sessions left in this package'}</p></div><button class="btn pri" data-t="push" data-v="${c.id}">${ic('plus')}Push a session</button></div><div class="list" style="margin-top:12px">${ss.map(s=>`<div class="it"><b class="num" style="width:150px">${dayName(s.d)}, ${s.t}</b><div class="grow">${s.type} · ${s.where}</div><span class="st ${s.st==='Confirmed'?'good':'warn'}">${s.st}</span></div>`).join('')||'<div class="empty">No sessions booked.</div>'}</div></div>`;}
  if(t==='notes')body=`<div class="card"><h3>Private notes</h3><p class="sub">Only you can see these</p>${c.notes.map(n=>`<div class="note" style="color:var(--fg);margin-bottom:8px">${esc(n)}</div>`).join('')}<div class="row" style="flex-wrap:nowrap"><input class="in" id="t_note" style="flex:1" placeholder="e.g. Prefers morning sessions, vegetarian on Mondays"><button class="btn" data-t="addnote" data-v="${c.id}">Add note</button></div></div>`;
  return `<button class="btn ghost sm" data-t="clback" style="margin:0 0 8px -8px">← All clients</button><div class="top"><div class="who" style="gap:14px">${cav(c,64)}<div><h1 style="font-size:24px">${esc(c.n)}</h1><p>${pkn(c.pk)} · ${c.goal} · ${d>0?'+':''}${d} kg since ${c.since} · <span class="st ${c.status}">${stLabel[c.status]}</span></p></div></div><div class="row"><button class="btn" data-t="gochat" data-v="${c.id}">${ic('chat')}Message</button><button class="btn" data-t="push" data-v="${c.id}">${ic('clock')}Push session</button><button class="btn pri" data-t="ctab" data-v="program">${ic('dumbbell')}Send program</button></div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button data-t="ctab" data-v="${k}" class="${t===k?'on':''}">${l}</button>`).join('')}</div>${body}`;}

R.schedule=()=>{const w=TS.wk,days=[...Array(7)].map((_,i)=>w*7+i),hours=['07:00','08:30','10:00','17:00','18:30','20:00'];
  return hdr('Schedule',`Week of ${dayName(w*7).replace(/^\w+, /,'')} · ${SESS.filter(s=>s.d>=w*7&&s.d<w*7+7).length} sessions`,`<div class="seg"><button data-t="wk" data-v="0" class="${w===0?'on':''}">This week</button><button data-t="wk" data-v="1" class="${w===1?'on':''}">Next week</button></div><button class="btn pri" data-t="push">${ic('plus')}Push a session</button>`)+
  `<div class="grid g21"><div class="card" style="padding:0"><div class="tw" style="margin:0;border:0"><table style="min-width:760px;table-layout:fixed"><thead><tr><th style="width:64px"></th>${days.map(d=>`<th style="${d===TODAY?'color:var(--accent-ink)':''}">${dayName(d).split(',')[0]} ${new Date(2026,10,2+d).getDate()}</th>`).join('')}</tr></thead><tbody>
  ${hours.map(h=>`<tr><td class="mut num" style="vertical-align:top;font-size:12.5px">${h}</td>${days.map(d=>{const s=SESS.find(x=>x.d===d&&x.t===h);const c=s&&byId(s.c);return`<td style="padding:4px;vertical-align:top;height:64px">${s?`<button data-t="client" data-v="${c.id}" style="width:100%;height:100%;text-align:left;border:0;border-radius:8px;padding:6px 8px;background:${s.where==='Video call'?'var(--chip-trial)':'var(--chip-pro)'};color:var(--chip-ink);font-size:12px;line-height:1.3"><b style="display:block;font-weight:600">${esc(fname(c))}</b>${s.type}${s.st!=='Confirmed'?' · <i>'+s.st+'</i>':''}</button>`:`<button data-t="push" data-v="" data-d="${d}" data-h="${h}" aria-label="Add a session ${dayName(d)} ${h}" style="width:100%;height:100%;border:1px dashed transparent;border-radius:8px;background:none;color:var(--faint);font-size:12px" onmouseover="this.style.borderColor='var(--line)'" onmouseout="this.style.borderColor='transparent'">+</button>`}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="grid" style="align-content:start"><div class="card"><h3>Requests</h3><p class="sub">${REQ.length} waiting</p><div class="list">${REQ.map(r=>{const c=byId(r.c);return`<div class="it" style="align-items:flex-start">${cav(c,28)}<div class="grow"><b style="font-weight:500">${esc(fname(c))}</b><div class="mut" style="font-size:12.5px">${dayName(r.d)}, ${r.t} · ${r.where}</div><div class="row" style="margin-top:6px"><button class="btn sm pri" data-t="reqok" data-v="${r.id}">Accept</button><button class="btn sm" data-t="reqmove" data-v="${r.id}">Other time</button></div></div></div>`}).join('')||'<div class="empty">Nothing waiting.</div>'}</div></div>
  <div class="card"><h3>Your hours</h3><p class="sub">Clients can only pick these times</p><dl class="dl"><dt>Sat–Thu</dt><dd>07:00–11:00, 17:00–21:00</dd><dt>Friday</dt><dd>07:00–12:00</dd><dt>Session</dt><dd>60 min, 30 min buffer</dd><dt>Cancel</dt><dd>Up to 12 hours before</dd></dl><div class="legend" style="margin:12px 0 0"><span><i style="background:var(--chip-pro)"></i>At the gym</span><span><i style="background:var(--chip-trial)"></i>Video call</span></div></div></div></div>`;};

R.checkins=()=>{const list=CIS.filter(x=>TS.ckf==='all'||x.kind===TS.ckf);const missing=CL.filter(c=>c.late);
  return hdr('Check-ins','Daily check-ins arrive every morning. Weekly updates come in on Sundays.',`<div class="seg">${[['all','All'],['daily','Daily'],['weekly','Weekly']].map(([k,l])=>`<button data-t="ckf" data-v="${k}" class="${TS.ckf===k?'on':''}">${l}</button>`).join('')}</div>`)+
  `<div class="grid g21"><div class="card"><div class="tw" style="margin-top:-18px;border-top:0"><table><thead><tr><th>Client</th><th>When</th><th class="num">Weight</th><th class="num">Sleep</th><th class="num">Energy</th><th>Workout</th><th>Diet</th><th>Note</th><th></th></tr></thead><tbody>
  ${list.map((x,i)=>{const c=byId(x.c);return`<tr><td><div class="who">${cav(c,28)}<b style="font-weight:500">${esc(fname(c))}</b>${x.kind==='weekly'?' <span class="chip pro">Weekly</span>':''}</div></td><td class="mut" style="white-space:nowrap">${x.when}</td><td class="num">${x.w} kg</td><td class="num">${x.sleep} h</td><td class="num">${x.energy}/5</td><td><span class="st ${x.wo==='Missed'?'crit':x.wo==='Partly'?'warn':'good'}">${x.wo}</span></td><td>${x.diet}</td><td class="mut" style="max-width:200px">${esc(x.note)||'—'}</td><td>${x.replied?'<span class="mut" style="font-size:12.5px">Replied</span>':`<button class="btn sm" data-t="cireply" data-v="${i}">Reply</button>`}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card" style="align-self:start"><h3>Not in yet</h3><p class="sub">${missing.length} clients missed 2 or more days</p><div class="list">${missing.map(c=>`<div class="it">${cav(c,28)}<div class="grow"><b style="font-weight:500">${esc(fname(c))}</b><div class="mut" style="font-size:12.5px">Last: ${c.lastCI}</div></div><button class="btn sm" data-t="nudge" data-v="${c.id}">Remind</button></div>`).join('')}</div><button class="btn" style="margin-top:12px;width:100%;justify-content:center" data-t="nudgeall">Remind all ${missing.length}</button>
  <div class="note" style="margin-top:12px">${ic('bell')}<span>Automatic reminder goes out at 08:00 to anyone who hasn’t checked in. Change it on the Notifications page.</span></div></div></div>`;};

R.chat=()=>{const id=TS.chat,c=byId(id),th=THREADS[id]||(THREADS[id]=[]);c.unread=0;const keys=Object.keys(THREADS);
  return hdr('Chat','Direct messages with your clients. Clients see “Usually replies in about 1 hour”.')+
  `<div class="card" style="padding:0;display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);min-height:560px;overflow:hidden" id="chatgrid">
   <div style="border-right:1px solid var(--line);overflow-y:auto;max-height:640px">${keys.map(k=>{const x=byId(k),last=THREADS[k][THREADS[k].length-1];return`<button data-t="thread" data-v="${k}" style="display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);padding:12px 14px;background:${k===id?'var(--sunk)':'transparent'}">${cav(x,36)}<span style="flex:1;min-width:0"><span class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-weight:${x.unread?700:500}">${esc(x.n)}</b><small class="mut">${last?last.at:''}</small></span><span class="mut" style="font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?(last.me?'You: ':'')+esc(last.t):'No messages yet'}</span></span>${x.unread?`<span class="badge" style="background:var(--accent);color:var(--on-accent);border-radius:9px;font-size:11px;padding:0 6px;line-height:18px">${x.unread}</span>`:''}</button>`}).join('')}</div>
   <div style="display:flex;flex-direction:column;min-width:0"><div class="row" style="padding:12px 16px;border-bottom:1px solid var(--line);justify-content:space-between">${`<div class="who">${cav(c,36)}<div><b>${esc(c.n)}</b><small>${pkn(c.pk)} · last check-in ${c.lastCI.toLowerCase()}</small></div></div>`}<button class="btn sm" data-t="client" data-v="${c.id}">Client profile</button></div>
    <div id="tmsgs" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;max-height:460px">${th.map(m=>`<div style="align-self:${m.me?'flex-end':'flex-start'};max-width:72%;background:${m.me?'var(--accent)':'var(--sunk)'};color:${m.me?'var(--on-accent)':'var(--fg)'};padding:8px 12px;border-radius:14px;${m.me?'border-bottom-right-radius:4px':'border-bottom-left-radius:4px'}">${esc(m.t)}<div style="font-size:11px;opacity:.7;margin-top:2px;text-align:right">${m.at}${m.me?' · Read':''}</div></div>`).join('')}</div>
    <div style="padding:8px 16px 0;display:flex;gap:6px;flex-wrap:wrap">${QUICK.map(q=>`<button class="btn sm" data-t="quick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>
    <form id="t_chatf" class="row" style="padding:12px 16px;flex-wrap:nowrap"><input class="in" id="t_chatin" style="flex:1" placeholder="Message ${esc(fname(c))}" autocomplete="off"><button class="btn pri" type="submit">Send</button></form></div></div>`;};

R.programs=()=>{const p=PROGS[TS.prog],d=p.days[TS.pday];
  return hdr('Workout programs','Build a program once, then adjust and send it to one client or many',`<button class="btn" data-t="newprog">${ic('plus')}New program</button><button class="btn pri" data-t="sendprog" data-v="${TS.prog},">${ic('check')}Send to clients</button>`)+
  `<div class="grid" style="grid-template-columns:minmax(0,260px) minmax(0,1fr)" id="proggrid"><div class="card" style="align-self:start;padding:8px">${PROGS.map((x,i)=>`<button data-t="prog" data-v="${i}" style="display:block;width:100%;text-align:left;border:0;border-radius:9px;padding:10px 12px;background:${i===TS.prog?'var(--sunk)':'transparent'}"><b style="font-weight:500">${esc(x.name)}</b><div class="mut" style="font-size:12.5px">${x.days.length} days · ${x.weeks} weeks · sent to ${x.sent}</div></button>`).join('')}</div>
  <div class="card"><div class="grid g3" style="gap:12px"><label class="f">Program name<input class="in" id="t_pname" value="${esc(p.name)}"></label><label class="f">Length<select class="in" id="t_pweeks">${[4,6,8,12].map(w=>`<option value="${w}" ${w===p.weeks?'selected':''}>${w} weeks</option>`).join('')}</select></label><label class="f">Level<select class="in" id="t_plevel">${['Beginner','Intermediate','Advanced'].map(l=>`<option ${l===p.level?'selected':''}>${l}</option>`).join('')}</select></label></div>
   <div class="tabs" style="margin-top:16px">${p.days.map((x,i)=>`<button data-t="pday" data-v="${i}" class="${i===TS.pday?'on':''}">Day ${i+1} · ${esc(x.n)}</button>`).join('')}<button data-t="addday">+ Add day</button></div>
   <div class="tw" style="margin:0 -18px"><table><thead><tr><th>Exercise</th><th class="num">Sets</th><th class="num">Reps</th><th class="num">Weight (kg)</th><th class="num">Rest (s)</th><th>Coach note</th><th></th></tr></thead><tbody>
   ${d.ex.map((e,i)=>`<tr><td><select class="in" data-pe="${i},0" aria-label="Exercise">${EXL.map(n=>`<option ${n===e[0]?'selected':''}>${n}</option>`).join('')}</select></td><td class="num"><input class="in num" data-pe="${i},1" value="${e[1]}" style="width:56px" aria-label="Sets"></td><td class="num"><input class="in num" data-pe="${i},2" value="${esc(e[2])}" style="width:80px" aria-label="Reps"></td><td class="num"><input class="in num" data-pe="${i},3" value="${e[3]}" style="width:70px" aria-label="Weight"></td><td class="num"><input class="in num" data-pe="${i},4" value="${e[4]}" style="width:64px" aria-label="Rest"></td><td><input class="in" data-pe="${i},5" value="${esc(e[5])}" placeholder="Optional" aria-label="Note"></td><td style="white-space:nowrap"><button class="btn sm ghost" data-t="exup" data-v="${i}" aria-label="Move up" ${i?'':'disabled'}>↑</button><button class="btn sm ghost" data-t="exdel" data-v="${i}" aria-label="Remove" style="color:var(--crit)">${ic('x')}</button></td></tr>`).join('')}</tbody></table></div>
   <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn" data-t="exadd">${ic('plus')}Add exercise</button><span class="mut" style="font-size:12.5px">${d.ex.reduce((t,e)=>t+ +e[1],0)} sets · about ${Math.round(d.ex.reduce((t,e)=>t+ +e[1]*(45+ +e[4]),0)/60)} min</span></div></div></div>`;};

R.packages=()=>hdr('Packages','What people can buy on your trainer page in the app',`<button class="btn pri" data-t="savepk">${ic('check')}Save packages</button>`)+
  `<div class="card" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><div><h3>Client limit</h3><p class="sub" style="margin:0">${CL.length} of ${TCAP} spots taken · 12 people on the waitlist</p></div><span class="mut">The app shows “${TCAP-CL.length} spots left” on your page</span></div>${capBar()}</div>
  <div class="grid g3">${PK.map((p,i)=>`<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="row" style="justify-content:space-between"><h3 style="font-size:17px">${esc(p.n)}</h3><button class="tog ${p.on?'on':''}" data-t="pkon" data-v="${i}" aria-pressed="${p.on}" aria-label="On sale"></button></div>
   <div class="grid g2 keep2" style="gap:10px"><label class="f">Price (USD)<input class="in num" id="pk_p${i}" value="${p.price}"></label><label class="f">Sessions<input class="in num" id="pk_s${i}" value="${p.sess}"></label></div>
   <label class="f">Billing<select class="in" id="pk_b${i}"><option ${p.per==='month'?'selected':''} value="month">Every month</option><option ${p.per==='once'?'selected':''} value="once">One payment</option></select></label>
   <div><div class="mut" style="font-size:12.5px;margin-bottom:6px">Included</div>${p.f.map(f=>`<div class="row" style="gap:8px;font-size:13.5px;padding:3px 0;flex-wrap:nowrap"><span style="color:var(--good)">${ic('check').replace('<svg class=""','<svg style="width:14px;height:14px"')}</span>${esc(f)}</div>`).join('')}</div>
   <div class="mut" style="font-size:12.5px;margin-top:auto">${CL.filter(c=>c.pk===p.id).length} clients on this package</div></div>`).join('')}</div>
  <div class="note" style="margin-top:16px">${ic('info')}<span>Packages are sold through the App Store and Google Play, so a price change also needs updating in App Store Connect and Play Console.</span></div>`;

R.applications=()=>hdr('Trainer applications','Trainers who want to coach their own clients on FitTrack. Only one trainer is active for now.')+
  `<div class="note" style="margin-bottom:16px">${ic('info')}<span>Approving puts a trainer on the launch list. They get access when multi-trainer support ships.</span></div><div class="card"><div class="tw" style="margin-top:-18px;border-top:0"><table><thead><tr><th>Trainer</th><th>City</th><th>Experience</th><th>Coaches</th><th>Certifications</th><th>Applied</th><th>Status</th><th></th></tr></thead><tbody>
  ${APPS.map((a,i)=>`<tr><td><b style="font-weight:500">${esc(a.n)}</b><div class="mut" style="font-size:12.5px;max-width:260px">${esc(a.bio)}</div></td><td>${esc(a.city)}</td><td>${a.yrs} yrs</td><td>${a.spec.join(', ')}</td><td>${esc(a.certs)}</td><td class="mut">${a.when}</td><td><span class="st ${a.st==='Approved'?'good':a.st==='Rejected'?'crit':a.st==='New'?'neu':'warn'}">${a.st}</span></td><td style="white-space:nowrap">${a.st==='New'||a.st==='Info requested'?`<button class="btn sm pri" data-t="app" data-v="${i},Approved">Approve</button> <button class="btn sm" data-t="app" data-v="${i},Info requested">Ask for info</button> <button class="btn sm dng" data-t="app" data-v="${i},Rejected">Reject</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;

/* ---------- modals ---------- */
function pushModal(cid,d,h){open(head('Push a session')+`<form id="t_pushf"><div class="ob">
  <label class="f">Client<select class="in" id="ps_c">${CL.map(c=>`<option value="${c.id}" ${c.id===cid?'selected':''}>${esc(c.n)} · ${pkn(c.pk)}</option>`).join('')}</select></label>
  <div class="grid g2" style="gap:12px"><label class="f">Day<select class="in" id="ps_d">${[...Array(14)].map((_,i)=>`<option value="${i}" ${i===(d??TODAY+1)?'selected':''}>${dayName(i)}</option>`).join('')}</select></label><label class="f">Time<select class="in" id="ps_t">${['07:00','08:30','10:00','17:00','18:30','20:00'].map(t=>`<option ${t===h?'selected':''}>${t}</option>`).join('')}</select></label></div>
  <div class="grid g2" style="gap:12px"><label class="f">Session<select class="in" id="ps_y"><option>Lower body strength</option><option>Upper body</option><option>Full body</option><option>Form review</option><option>Body scan</option></select></label><label class="f">Where<select class="in" id="ps_w"><option>Iron Yard Gym</option><option>Video call</option></select></label></div>
  <div class="note">${ic('bell')}<span>The client gets a push notification and the session shows in their app. They can accept or ask for another time.</span></div></div>
  <div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Push session</button></div></form>`,'modal');}
function sendProgModal(pi,cid){const p=PROGS[pi];open(head(`Send “${esc(p.name)}”`)+`<form id="t_sendf" data-p="${pi}"><div class="ob">
  <div class="search">${ic('search')}<input class="in" id="sp_q" style="width:100%" placeholder="Find clients"></div>
  <div style="max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:10px" id="sp_list">${CL.map(c=>`<label class="row" style="padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:nowrap" data-n="${esc(c.n.toLowerCase())}"><input type="checkbox" name="spc" value="${c.id}" ${c.id===cid?'checked':''}>${cav(c,26)}<span class="grow">${esc(c.n)}</span><small class="mut">${c.prog?esc(c.prog):'No program'}</small></label>`).join('')}</div>
  <div class="grid g2" style="gap:12px"><label class="f">Starts<select class="in" id="sp_start"><option>Monday, Nov 9</option><option>Tomorrow</option><option>Today</option></select></label><label class="f">Scale weights to each client<select class="in"><option>Yes, from their last sessions</option><option>No, use the weights as written</option></select></label></div>
  <label class="f">Message<input class="in" id="sp_msg" value="New program for the next ${p.weeks} weeks. Tell me how day 1 feels!"></label></div>
  <div class="of"><button type="button" class="btn" data-a="close">Cancel</button><button class="btn pri" type="submit">Send program</button></div></form>`,'modal');}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-t]');if(!el)return;const a=el.dataset.t,v=el.dataset.v;
  const X={
   client:()=>{TS.cl=v;TS.ctab='overview';go('clients')},clback:()=>{TS.cl=null;render()},ctab:()=>{TS.ctab=v;render()},
   flt:()=>{TS.flt=v;render()},wk:()=>{TS.wk=+v;render()},ckf:()=>{TS.ckf=v;render()},
   push:()=>{TS.mv=null;pushModal(v||TS.cl,el.dataset.d!=null?+el.dataset.d:undefined,el.dataset.h)},
   gochat:()=>{if(v)TS.chat=v;go('chat')},thread:()=>{TS.chat=v;const c=byId(v);c.unread=0;render()},
   quick:()=>{$('#t_chatin').value=v;$('#t_chatin').focus()},
   reqok:()=>{const i=REQ.findIndex(r=>r.id===v),r=REQ[i];SESS.push({id:'s'+Date.now(),d:r.d,t:r.t,c:r.c,type:'Full body',where:r.where,st:'Confirmed'});REQ.splice(i,1);log(`Accepted session with ${byId(r.c).n}, ${dayName(r.d)} ${r.t}`);toast(`Confirmed. ${fname(byId(r.c))} gets a notification`);render()},
   reqmove:()=>{const r=REQ.find(x=>x.id===v);TS.mv=v;pushModal(r.c,r.d,'08:30')},
   nudge:()=>{const c=byId(v);log(`Sent check-in reminder to ${c.n}`);toast(`Reminder sent to ${fname(c)}`)},
   nudgeall:()=>{log('Sent check-in reminder to all late clients');toast(`Reminder sent to ${CL.filter(c=>c.late).length} clients`)},
   cireply:()=>{const x=CIS.filter(y=>TS.ckf==='all'||y.kind===TS.ckf)[+v];TS.chat=x.c;go('chat');setTimeout(()=>{const i=$('#t_chatin');if(i){i.value='Thanks for checking in! ';i.focus()}},30)},
   wkreply:()=>{const c=byId(v);log(`Sent weekly review to ${c.n}`);toast(`Weekly review sent to ${fname(c)}`);const i=$('#t_wkr');if(i)i.value=''},
   senddiet:()=>{const c=byId(v);c.diet=$('#t_dplan').value;c.kcal=+$('#t_dkcal').value||c.kcal;log(`Sent ${c.diet} diet (${c.kcal} kcal) to ${c.n}`);toast(`Diet plan sent to ${fname(c)}. It shows on their Meal plan screen`);render()},
   gomeal:()=>go('meal-plans'),
   addnote:()=>{const c=byId(v),t=$('#t_note').value.trim();if(!t)return;c.notes.push(t+' · today');render()},
   editprog:()=>{TS.prog=+v;TS.pday=0;go('programs')},
   sendprog:()=>{const[pi,cid]=v.split(',');sendProgModal(+pi,cid)},
   prog:()=>{TS.prog=+v;TS.pday=0;render()},pday:()=>{TS.pday=+v;render()},
   addday:()=>{const p=PROGS[TS.prog];p.days.push({n:'Day '+(p.days.length+1),ex:[['Barbell squat',3,'8',40,90,'']]});TS.pday=p.days.length-1;render()},
   newprog:()=>{PROGS.push({name:'New program',weeks:4,level:'Beginner',sent:0,days:[{n:'Full body',ex:[['Barbell squat',3,'8',40,90,''],['Push-up',3,'10',0,60,'']]}]});TS.prog=PROGS.length-1;TS.pday=0;render()},
   exadd:()=>{PROGS[TS.prog].days[TS.pday].ex.push(['Plank',3,'40 s',0,45,'']);render()},
   exdel:()=>{PROGS[TS.prog].days[TS.pday].ex.splice(+v,1);render()},
   exup:()=>{const l=PROGS[TS.prog].days[TS.pday].ex,i=+v;[l[i-1],l[i]]=[l[i],l[i-1]];render()},
   pkon:()=>{PK[+v].on=!PK[+v].on;render()},
   savepk:()=>{PK.forEach((p,i)=>{p.price=+$('#pk_p'+i).value||p.price;p.sess=+$('#pk_s'+i).value||0;p.per=$('#pk_b'+i).value});log('Updated trainer packages');toast('Packages saved. The app shows the new prices')},
   app:()=>{const[i,st]=v.split(',');APPS[+i].st=st;log(`${st} trainer application from ${APPS[+i].n}`);toast(st==='Approved'?`${APPS[+i].n} is on the launch list`:st);render()}};
  X[a]&&X[a]();});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='tq'){TS.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#tq');q.focus();q.setSelectionRange(pos,pos)}
  if(id==='sp_q'){const q=e.target.value.toLowerCase();document.querySelectorAll('#sp_list label').forEach(l=>l.hidden=!l.dataset.n.includes(q))}
  if(e.target.dataset.pe){const[i,k]=e.target.dataset.pe.split(',').map(Number);PROGS[TS.prog].days[TS.pday].ex[i][k]=k===1||k===3||k===4?+e.target.value||0:e.target.value}
  if(id==='t_pname'){PROGS[TS.prog].name=e.target.value}});
document.addEventListener('change',e=>{if(e.target.dataset.pe){const[i,k]=e.target.dataset.pe.split(',').map(Number);PROGS[TS.prog].days[TS.pday].ex[i][k]=e.target.value;if(k===0)render()}
  if(e.target.id==='t_pweeks')PROGS[TS.prog].weeks=+e.target.value;if(e.target.id==='t_plevel')PROGS[TS.prog].level=e.target.value;if(e.target.id==='t_pname')render()});
document.addEventListener('submit',e=>{const f=e.target;
  if(f.id==='t_chatf'){const t=$('#t_chatin').value.trim();if(!t)return;THREADS[TS.chat].push({me:true,t,at:'Now'});render();const m=$('#tmsgs');if(m)m.scrollTop=m.scrollHeight;$('#t_chatin').focus()}
  if(f.id==='t_pushf'){const c=byId($('#ps_c').value),d=+$('#ps_d').value,t=$('#ps_t').value;SESS.push({id:'s'+Date.now(),d,t,c:c.id,type:$('#ps_y').value,where:$('#ps_w').value,st:'Sent'});if(TS.mv){const ri=REQ.findIndex(r=>r.id===TS.mv);if(ri>=0)REQ.splice(ri,1);TS.mv=null}log(`Pushed session to ${c.n}, ${dayName(d)} ${t}`);close();toast(`Session sent to ${fname(c)} for ${dayName(d)}, ${t}`);render()}
  if(f.id==='t_sendf'){const ids=[...f.querySelectorAll('input[name=spc]:checked')].map(x=>x.value);if(!ids.length){toast('Pick at least one client');return}const p=PROGS[+f.dataset.p];ids.forEach(id=>{byId(id).prog=p.name+' · Week 1'});p.sent+=ids.length;log(`Sent program “${p.name}” to ${ids.length} client${ids.length>1?'s':''}`);close();toast(`“${p.name}” sent to ${ids.length===1?fname(byId(ids[0])):ids.length+' clients'}. It shows on their Workout tab`);render()}});
/* nav: trainer group first */
SECS.unshift(['today','Today','home','Trainer'],['clients','Clients','users'],['schedule','Schedule','clock'],['checkins','Check-ins','check'],['chat','Chat','chat'],['programs','Workout programs','dumbbell'],['packages','Packages','tag'],['applications','Trainer applications','flag']);
SECS.forEach(s=>{if(s[0]==='overview')s[3]='App business';if(s[0]==='coach')s[1]='Trainer profile'});
const _nav=nav;nav=function(){_nav();const u=Object.keys(THREADS).reduce((t,k)=>t+(byId(k).unread||0),0);const b=document.querySelector('#nav [data-v="chat"]');if(b&&u)b.insertAdjacentHTML('beforeend',`<span class="badge">${u}</span>`);const r=document.querySelector('#nav [data-v="today"]');if(r&&REQ.length)r.insertAdjacentHTML('beforeend',`<span class="badge">${REQ.length}</span>`)};
const _go=go;go=function(k){if(k!=='clients')TS.cl=null;_go(k)};
S.notifs.unshift({t:'Time for your daily check-in',aud:'Trainer clients (automatic)',when:'Automatic',sent:'08:00 daily',open:'64%'},{t:'Session tomorrow with Maya',aud:'Trainer clients (automatic)',when:'Automatic',sent:'Day before, 19:00',open:'82%'});
document.querySelector('.brand small').textContent='Trainer and admin';
go(location.hash.slice(1)||'today');

</script>
